# audiorec — Schreibdaten frueher auf den Datentraeger bringen
#
# Der Kernel sammelt Schreibdaten und gibt sie erst nach 30 Sekunden ab
# (dirty_expire_centisecs = 3000). Das ist fuer Schreibtischbetrieb
# sinnvoll: weniger, dafuer groessere Schuebe.
#
# Fuer eine Live-Aufnahme ist es die falsche Abwaegung. Bei 9 MB/s haengen
# so bis zu 270 MB im Arbeitsspeicher — bei einem Stromausfall waeren das
# 30 Sekunden Musik, die nie auf der Platte ankamen. Zusaetzlich zu der
# Datei, deren Kopf arecord nicht mehr schreiben konnte.
#
# 5 Sekunden begrenzen den Verlust auf ein Sechstel davon. Der Preis sind
# haeufigere Schreibvorgaenge — bei einer SSD ohne Bedeutung, und die
# Schuebe sind mit rund 45 MB immer noch gross genug, um effizient zu sein.
vm.dirty_expire_centisecs = 500

# Wie oft der Aufraeumfaden nachsieht (Voreinstellung 500 = 5 s).
# Haelft, damit die 5 Sekunden oben auch eingehalten werden.
vm.dirty_writeback_centisecs = 250

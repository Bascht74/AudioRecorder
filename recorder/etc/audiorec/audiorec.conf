# audiorec — Konfiguration
# Nach jeder Aenderung:  sudo systemctl restart audiorec

[device]
# Nach welchen Soundkarten gesucht wird (Teilstrings, Gross-/Kleinschreibung
# egal, mehrere durch Komma getrennt).
#
# LEER = jedes angeschlossene Audio-Interface wird genommen.
# Das ist die Voreinstellung: anstecken, Aufnahme laeuft.
# Namen herausfinden mit:   cat /proc/asound/cards
match =

# Diese niemals verwenden (HDMI-Ausgaenge, Onboard-Ton)
ignore = vc4hdmi, Headphones, bcm2835

# Wie oft geprueft wird, ob ein Geraet da ist (Sekunden).
# Derselbe Takt schreibt auch den Status fuer das Display – deshalb
# bestimmt dieser Wert, wie fluessig die VU-Anzeige laeuft.
poll_interval_s = 0.5

# Obergrenze fuer gleichzeitig aufnehmende Geraete.
# 0 = unbegrenzt: jedes gefundene Interface bekommt eine eigene Aufnahme
# mit eigenem Ordner und eigenem Prozess.
max_devices = 0

# Nach einem Fehler so lange warten, bevor das Geraet erneut versucht wird.
retry_delay_s = 10

# Wachhund: Waechst die Aufnahmedatei so lange nicht mehr, obwohl der
# Prozess noch lebt, wird sie gestoppt und neu gestartet. Faengt echte
# Aufhaenger ab, die systemd nicht bemerkt, weil der Prozess ja laeuft.
# 0 = abgeschaltet.
stall_timeout_s = 30


[recording]
# ---------------------------------------------------------------------------
# ERSATZZIEL
#
# Hierhin wird nur aufgenommen, wenn KEIN externer Datentraeger
# angeschlossen ist. Steckt eine SSD oder ein Stick, gewinnt der
# (siehe usb_target weiter unten) – unabhaengig vom Namen.
#
# Der Ordner liegt auf der System-SD-Karte und wird vom Installations-
# skript angelegt.
# ---------------------------------------------------------------------------
target_dir = /home/pi/rec

# Nur aufnehmen, wenn target_dir ein eigener Einhaengepunkt ist.
# Bei einem Ordner auf der SD-Karte muss das auf "no" stehen.
require_mountpoint = no

# ---------------------------------------------------------------------------
# Externer Datentraeger als Ziel
#
#   auto  Jede angeschlossene SSD bzw. jeder Stick wird ohne Rueckfrage
#         als Ziel genommen. (Voreinstellung) Der Name spielt keine Rolle.
#   ask   Das Display fragt erst nach.
#   no    Externe Datentraeger ignorieren, immer target_dir verwenden.
#
# Wichtig bei "auto": Umgeschaltet wird nur, solange noch KEINE Aufnahme
# laeuft. Ein Stick, den man um 22 Uhr zum Kopieren einsteckt, lenkt die
# laufende Aufnahme also nicht um.
#
# Ausserdem werden Datentraeger uebergangen, auf denen weniger als
# min_free_gb frei ist – ein versehentlich eingesteckter kleiner Stick
# wird dadurch ignoriert statt zum Problem.
# ---------------------------------------------------------------------------
usb_target = auto

# ---------------------------------------------------------------------------
# Startkarenz (Sekunden)
#
# Haengt die SSD beim Einschalten schon am Pi, haengt der Desktop sie erst
# ein paar Sekunden nach dem Dienststart ein. Ohne Karenz liefe die
# Aufnahme so lange auf dem Ersatzziel und wuerde beim Auftauchen der SSD
# abgebrochen und neu gestartet.
#
# Deshalb wartet der Dienst nach dem Start so lange auf einen externen
# Datentraeger, BEVOR er die erste Aufnahme beginnt. Taucht die SSD
# frueher auf, gehts sofort los – gewartet wird nur, solange noch gar
# nichts laeuft.
#
# In derselben Karenz wartet der Dienst auch darauf, dass die Uhr per Netz
# gestellt ist (siehe wait_for_clock) – beides laeuft parallel.
#
# Kommt weder das eine noch das andere, faengt er nach Ablauf trotzdem an.
# Lieber ein Ordner zu viel oder ein schiefer Zeitstempel als eine
# fehlende Aufnahme.
# 0 = keine Karenz.
startup_grace_s = 60

# Vor der ersten Aufnahme auf den Zeitabgleich warten (nur innerhalb von
# startup_grace_s).
#
# Die Dateinamen sind Zeitstempel. Der Pi 5 hat zwar eine Uhr, behaelt die
# Zeit ohne Knopfzelle am J5-Anschluss aber nicht ueber das Ausschalten
# hinweg – ohne Netz hiesse die erste Datei r_700101_010000.wav. Schlimmer
# noch: springt die Uhr mitten in der Aufnahme, sortiert sich die naechste
# Datei VOR die bisherigen.
#
# no = sofort loslegen, auch mit falscher Uhr.
wait_for_clock = yes

# Dasselbe fuer den Modus usb_target = ask: so lange auf die Antwort
# warten, bevor ohne sie gestartet wird.
usb_ask_grace_s = 90

# Wo Raspberry Pi OS Wechseldatentraeger einhaengt
usb_mount_root = /media

# Unterordner, der auf dem Stick angelegt wird (leer = Wurzelverzeichnis)
usb_subdir = audiorec

# Planwert: so viel Platz sollte auf dem Zieldatentraeger frei sein (GB).
#
# Wofuer der Wert benutzt wird:
#   * Bei der Zielsuche werden Datentraeger mit weniger freiem Platz
#     nachrangig behandelt — ein versehentlich eingesteckter 8-GB-Stick
#     wird dadurch uebergangen, solange es einen besseren gibt.
#   * Wird der Platz auf dem GEWAEHLTEN Ziel knapper als dieser Wert,
#     erscheint ein Hinweis in der Zustandszeile.
#
# Wofuer er ausdruecklich NICHT benutzt wird: als Abbruchbedingung. Eine
# unvollstaendige Aufnahme ist immer besser als gar keine. Abgebrochen
# wird erst, wenn wirklich nichts mehr frei ist (unter 1 GB).
#
# Erreicht KEIN angeschlossener Datentraeger den Wert, nimmt der Dienst
# den groessten trotzdem — sofern dort mehr Platz ist als im Ersatzordner
# auf der SD-Karte. Ein zu hoch gesetzter Planwert kann die Aufnahme also
# nicht auf die SD-Karte umleiten.
#
# 20 steht beim Ausprobieren nicht im Weg.
# VOR DEM ABEND HOEHER SETZEN – Faustwert: erwartete Menge plus 30 %:
#   16 Kanaele x 7 h (S32_LE) =  77 GB  ->  100
#   32 Kanaele x 7 h (S32_LE) = 155 GB  ->  200
#   beide zusammen            = 232 GB  ->  300
# Auf einer 1-TB-SSD ist das reichlich; auf einem kleineren Datentraeger
# lieber niedriger ansetzen als die Warnung den ganzen Abend stehen zu
# haben. Die laufende Absicherung ist ohnehin die Zeile "reicht" im
# Display.
min_free_gb = 20

# Ordnername je Aufnahme: <prefix>_<Geraet>_JJJJ-MM-TT_HHMMSS
session_prefix = gig

# Dateiname innerhalb des Ordners – strftime-Muster.
#   r_%y%m%d_%H%M%S.wav  ->  r_260806_155935.wav
filename_pattern = r_%y%m%d_%H%M%S.wav

# Wem die Aufnahmen gehoeren sollen (der Dienst laeuft als root)
owner = pi

# auto = so viele Kanaele, wie das Geraet anbietet.
# Ein Pult auf 16in/16out ergibt damit 16, ein 4-Kanal-Interface 4.
# Alternativ eine feste Obergrenze eintragen, z. B. 16.
channels = auto

rate = 48000

# Bevorzugte Formate in dieser Reihenfolge; das erste, das das Geraet
# kann, wird genommen.
#
# S24_3LE steht bewusst vorn: die meisten Pulte wandeln mit 24 Bit. S32_LE
# speichert dieselben 24 Nutzbits in 4 statt 3 Byte – ein Viertel mehr
# Daten ohne einen Deut mehr Klang.
#   48 Kanaele x 7 h:  S32_LE = 232 GB   ·   S24_3LE = 174 GB
# Bietet das Geraet kein S24_3LE, faellt der Dienst automatisch
# auf S32_LE zurueck.
format_preference = S24_3LE, S32_LE, S16_LE

# Nach wie vielen Sekunden eine neue Datei begonnen wird.
#
# WICHTIG: arecord bricht eine WAV bei 2 GiB ab, NICHT erst bei 4 GiB.
# (alsa-utils traegt in fmt_rec_table fuer WAVE 2147483648 Byte ein.)
# Bei vielen Kanaelen ist das lange vor 600 s erreicht:
#   32 Kanaele, S32_LE  = 6,14 MB/s -> 2 GiB nach  5:49 min
#   32 Kanaele, S24_3LE = 4,61 MB/s -> 2 GiB nach  7:46 min
#   16 Kanaele, S32_LE  = 3,07 MB/s -> 2 GiB nach 11:39 min
#
# Der Dienst rechnet das beim Start selbst nach und kuerzt den Wert, wenn
# er zu gross waere — bei 32 Kanaelen in S32_LE also auf 300 s. Im Journal
# steht dann eine Zeile "Dateilänge ... gekürzt", und in aufnahme.txt im
# Aufnahmeordner steht die tatsaechlich verwendete Laenge.
#
# Dieser Wert ist also eine OBERGRENZE, kein Versprechen. Kleinere Werte
# begrenzen den Schaden bei einem Abriss, groessere sind nie noetig.
max_file_time_s = 600

# Zusaetzliche arecord-Argumente, falls noetig, z. B. groessere Puffer:
#   arecord_extra = --buffer-time=500000 --period-time=100000
arecord_extra =

# ---------------------------------------------------------------------------
# Pegelmessung / VU-Anzeige
#
# Der Dienst liest dafuer die letzten ~42 ms der gerade wachsenden Datei
# zurueck und rechnet je Kanal den Spitzenwert in dBFS um. Gemessen wird
# also, was tatsaechlich auf der Karte steht – nicht, was am Eingang
# anliegt. Genau das ist der Punkt: eine ausschlagende Anzeige beweist,
# dass echtes Audio geschrieben wird.
#
# 0 = Pegelmessung aus (spart etwas Rechenzeit, VU-Anzeige bleibt leer).
# ---------------------------------------------------------------------------
level_interval_s = 0.5

# Ab welchem Pegel ein Kanal als "hat Signal" gilt (dBFS).
#
# -60 ist der uebliche Wert, erfasst aber schon das Grundrauschen eines
# aufgedrehten Mikrofoneingangs: das Display zeigt dann "32/32 aktiv",
# obwohl nur Rauschen ankommt – und die Zahl sagt nichts mehr aus.
#
# -50 ist die bewusste Entscheidung fuer diesen Aufbau: mit Signalen
# darunter laesst sich ohnehin nichts anfangen, und "aktiv" soll heissen,
# dass wirklich etwas anliegt. Der Preis: ein sehr leise ausgesteuerter
# Kanal zaehlt nicht mit. Die VU-Balken zeigen ihn trotzdem.
silence_dbfs = -50

# Wie oft der Dienst Temperatur, CPU-Last und Schreibpuffer misst.
# Laeuft in einem eigenen Faden, haelt die Aufnahme also nicht auf.
# Die Werte landen in status.json unter "system" – damit sehen Display,
# audiorec-status und die Fernabfrage dieselben Zahlen.
sys_interval_s = 5

# Zeitfenster fuer "max" und die Uebersteuerungszaehlung im Display.
# 900 = die letzten 15 Minuten. Bewusst nicht "seit Aufnahmebeginn":
# sonst steht eine einzelne Uebersteuerung um 18:30 Uhr um 00:30 Uhr
# immer noch da und sagt nichts mehr ueber die aktuelle Lage.
max_window_s = 900


[display]
# ---------------------------------------------------------------------------
# Zugangscodes fuer die beiden Touch-Tasten unten
#
# Ist ein Code gesetzt, erscheint beim Antippen ein Ziffernfeld. Erst der
# richtige Code loest die Aktion aus; nach 30 Sekunden ohne Eingabe
# schliesst sich das Feld von selbst.
#
# LEER = keine Abfrage, stattdessen die bisherige Rueckfrage
#        ("Wirklich? Nochmal tippen").
#
# Das ist kein Sicherheitsmerkmal — der Code steht hier im Klartext.
# Er schuetzt gegen Versehen und neugierige Finger, nicht gegen Absicht.
# ---------------------------------------------------------------------------
shutdown_code =

# Dasselbe fuer "Aufnahme stoppen" — der wichtigere der beiden: eine
# versehentlich gestoppte Aufnahme faellt niemandem auf, ein versehentlich
# heruntergefahrener Pi schon. Leer lassen, wenn das Stoppen ohne Code
# moeglich bleiben soll.
stop_code =
